<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forum — Mon compte</title>
  <link rel="stylesheet" href="JFKforum/assets/style.css" />
</head>
<body>
  <header class="navbar" id="navbar-root"></header>

  <main class="page-narrow">
    <p id="loading-msg" class="muted center" style="margin-top:40px">Chargement…</p>

    <div id="account-box" class="stack hidden">
      <div class="account-card">
        <div class="account-avatar" id="avatar-slot"></div>
        <div id="badge-slot"></div>
        <p class="hint-text font-mono" id="points-slot" style="margin-top:8px"></p>
      </div>

      <button id="logout-btn" class="btn-outline">Se déconnecter</button>

      <div class="account-card" style="text-align:left">
        <h2 class="font-display" style="font-size:15px;margin:0 0 10px">Photo de profil</h2>
        <div id="pfp-status" class="hint-text" style="margin-bottom:8px"></div>
        <div style="display:flex;gap:8px">
          <input id="pfp-url-input" class="input" placeholder="Lien vers l'image hébergée" />
          <button id="pfp-submit-btn" class="btn-outline" style="flex-shrink:0">Envoyer</button>
        </div>
        <p class="hint-text" style="margin-top:6px">Un modérateur doit approuver le lien avant qu'il n'apparaisse publiquement.</p>
      </div>

      <div class="account-card" style="text-align:left">
        <h2 class="font-display" style="font-size:15px;margin:0 0 10px">Bannière</h2>
        <div id="banner-status" class="hint-text" style="margin-bottom:8px"></div>
        <div style="display:flex;gap:8px">
          <input id="banner-url-input" class="input" placeholder="Lien vers l'image hébergée" />
          <button id="banner-submit-btn" class="btn-outline" style="flex-shrink:0">Envoyer</button>
        </div>
      </div>

      <p class="hint-text center">
        Le fil d'actualité personnalisé arrive dans une prochaine mise à jour.
      </p>
    </div>
  </main>

  <script type="module" src="JFKforum/assets/account.js"></script>
</body>
</html>
