<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forum</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">

  <aside class="sidebar" id="sidebar">
    <div class="logo"><span class="logo-mark"></span> forum</div>

    <nav>
      <div class="nav-section-label">Catégories</div>
      <a href="#" class="nav-link active" data-category="all">Tous</a>
      <a href="#" class="nav-link" data-category="informatique">Informatique</a>
      <a href="#" class="nav-link" data-category="societe">Société</a>
      <a href="#" class="nav-link" data-category="autres">Autres</a>
    </nav>

    <nav id="adminNav" style="display:none;">
      <div class="nav-section-label">Modération</div>
      <a href="#" class="nav-link" id="newCategoryLink">+ Nouvelle catégorie</a>
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="sidebarToggle">☰</button>
      <div class="search-bar">
        <span>⌕</span>
        <input type="text" id="searchInput" placeholder="Rechercher un titre, un #hashtag..." />
      </div>
      <button class="icon-btn" id="notifBtn">
        🔔
        <span class="notif-dot" id="notifDot" style="display:none;"></span>
      </button>
      <div id="accountArea"></div>
    </header>

    <main class="feed">
      <div class="feed-header">
        <h1 class="feed-title" id="feedTitle">Tous les posts</h1>
        <button class="fyp-refresh" id="shuffleBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
            <path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
          </svg>
          Mélanger
        </button>
      </div>

      <!-- Vue détail d'un post (affichée à la place du fil quand l'URL contient ?={id}) -->
      <div id="postDetail" style="display:none;"></div>

      <div id="postList"></div>
      <p id="feedEmpty" class="post-preview" style="display:none;">Aucune publication pour le moment.</p>
    </main>
  </div>
</div>

<!-- Bouton publier -->
<button class="publish-fab" id="openPublish">
  <span style="font-size:1.1rem;">＋</span> Publier
</button>

<!-- Modal de publication -->
<div class="modal-overlay" id="publishOverlay">
  <div class="modal-card">
    <div class="modal-head">
      <h2 class="auth-title" style="font-size:1.2rem;">Nouvelle publication</h2>
      <button class="icon-btn" id="closePublish">✕</button>
    </div>

    <div id="publishMsg" class="form-msg"></div>

    <form id="publishForm">
      <div class="field">
        <label for="postCategory">Catégorie</label>
        <select id="postCategory" required>
          <option value="informatique">Informatique</option>
          <option value="societe">Société</option>
          <option value="autres">Autres</option>
        </select>
      </div>

      <div class="field">
        <label for="postTitle">Titre</label>
        <input type="text" id="postTitle" maxlength="200" required />
      </div>

      <div class="field">
        <label for="postBody">Texte</label>
        <textarea id="postBody" rows="6" required placeholder="Aucune limite de caractères. Utilise #hashtag et @pseudo pour taguer."></textarea>
      </div>

      <label style="display:flex; align-items:center; gap:8px; font-size:0.85rem; color:var(--text-dim); margin-bottom:16px;">
        <input type="checkbox" id="postAnonymous" style="width:auto;" />
        Publier en tant qu'anonyme
      </label>

      <button type="submit" class="btn-primary">Publier</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/badges.js"></script>
<script src="js/app.js"></script>
</body>
</html>
