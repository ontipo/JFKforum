<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forum — Tous</title>
  <link rel="stylesheet" href="assets/style.css" />

  <link rel="icon" href="https://ontipo.github.io/JFKforum/assets/JFK.svg">

<meta property="og:title" content="JFKforum">
<meta property="og:description" content="Forum de notre Papakenne">
<meta property="og:image" content="https://ontipo.github.io/JFKforum/assets/site-og-resizes.png">
  <meta property="og:image:alt" content="Logo fondateur du JFKforum">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
</head>
<body>
  <header class="navbar" id="navbar-root"></header>

  <main class="page">
    <div id="shared-view" class="hidden">
      <button id="back-to-feed" class="refresh-btn" style="margin-bottom:16px">← retour au fil</button>
      <div id="shared-post-slot"></div>
    </div>

    <div id="feed-view">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
        <div id="tabs" class="tabs"></div>
        <select id="sort-select" class="input" style="width:auto;flex-shrink:0;padding:6px 10px;font-size:13px">
          <option value="personalized" selected>Personnalisé</option>
          <option value="recent">Plus récent</option>
          <option value="liked">Plus aimé</option>
          <option value="pinned">Épinglé</option>
          <option value="random">Au hasard</option>
        </select>
      </div>

      <p id="search-banner" class="hint-text hidden" style="margin-bottom:12px"></p>

      <p id="loading-msg" class="muted hidden">Chargement…</p>
      <p id="empty-msg" class="muted hidden">Aucune publication pour le moment.</p>

      <div id="posts-list"></div>
    </div>
  </main>

  <button id="publish-fab" class="publish-fab">+ Publier</button>

  <script type="module" src="assets/feed.js"></script>
</body>
</html>
