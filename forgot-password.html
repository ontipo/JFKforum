<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forum — Mot de passe oublié</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="navbar" id="navbar-root"></header>

  <main class="page-narrow">
    <h1 class="font-display center" style="font-size:24px;font-weight:600">Mot de passe oublié</h1>
    <p class="muted center" style="margin-bottom:20px">Joignez le PDF de récupération reçu à l'inscription.</p>

    <div id="upload-step">
      <div style="border:1px dashed var(--line);border-radius:12px;padding:24px;text-align:center">
        <input type="file" id="pdf-input" accept="application/pdf" />
      </div>
    </div>

    <form id="reset-form" class="stack hidden" style="margin-top:16px">
      <p id="file-name" class="hint-text" style="word-break:break-all"></p>
      <p class="hint-text" style="color:var(--silver-300)">Code retrouvé ✓ — choisissez un nouveau mot de passe.</p>
      <input type="password" id="new-password" class="input" placeholder="Nouveau mot de passe" />
      <button type="submit" id="reset-submit" class="btn-primary">Réinitialiser le mot de passe</button>
    </form>

    <p id="reset-done" class="center hidden" style="margin-top:16px">Mot de passe mis à jour ✓</p>
    <p id="reset-error" class="error-text center hidden" style="margin-top:12px"></p>
  </main>

  <script type="module" src="assets/auth-forgot.js"></script>
</body>
</html>
