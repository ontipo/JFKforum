<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forum — S'inscrire</title>
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <header class="navbar" id="navbar-root"></header>

  <main class="page-narrow">
    <form id="register-form" class="stack">
      <h1 class="font-display center" style="font-size:24px;font-weight:600">S'inscrire</h1>

      <div>
        <input id="reg-username" class="input" value="!" />
        <p class="hint-text">Doit commencer par « ! »</p>
      </div>

      <input id="reg-email" type="email" class="input" placeholder="Adresse e-mail" />
      <input id="reg-password" type="password" class="input" placeholder="Mot de passe" />

      <p id="reg-error" class="error-text hidden"></p>

      <button type="submit" id="reg-submit" class="btn-primary">Créer mon compte et télécharger mon code</button>

      <p class="hint-text center">
        Déjà un compte ? <a href="/login.html" class="link-underline">Se connecter</a>
      </p>
    </form>

    <div id="register-done" class="center hidden" style="margin-top:80px">
      <h1 class="font-display" style="font-size:20px">Compte créé</h1>
      <p class="muted">
        Votre PDF de récupération a été téléchargé. Conservez-le précieusement : c'est le seul moyen de récupérer
        votre compte.
      </p>
    </div>
  </main>

  <script type="module" src="/assets/auth-register.js"></script>
</body>
</html>
