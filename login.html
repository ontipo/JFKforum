<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forum — Se connecter</title>
  <link rel="stylesheet" href="assets/style.css" />

  <link rel="icon" href="https://ontipo.github.io/JFKforum/assets/JFK.svg">

<meta property="og:title" content="JFKforum - Se connecter">
<meta property="og:description" content="Forum de notre Papakenne">
<meta property="og:image" content="https://ontipo.github.io/JFKforum/assets/site-og-resizes.png">
  <meta property="og:image:alt" content="Logo fondateur du JFKforum">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
</head>
<body>
  <header class="navbar" id="navbar-root"></header>

  <main class="page-narrow">
    <form id="login-form" class="stack">
      <h1 class="font-display center" style="font-size:24px;font-weight:600">Se connecter</h1>

      <input id="login-email" type="email" class="input" placeholder="Adresse e-mail" />
      <input id="login-password" type="password" class="input" placeholder="Mot de passe" />

      <p id="login-error" class="error-text hidden"></p>

      <button type="submit" id="login-submit" class="btn-primary">Se connecter</button>

      <div style="display:flex;align-items:center;justify-content:space-between">
        <a href="register.html" class="link-underline hint-text">Créer un compte</a>
        <a href="forgot-password.html" class="link-underline hint-text">J'ai oublié mes informations</a>
      </div>

      <a href="ip-login.html" class="link-underline hint-text" style="display:block;text-align:center;margin-top:8px">
        Utiliser mon adresse IP comme porte-parole
      </a>
    </form>
  </main>

  <script type="module" src="assets/auth-login.js"></script>
</body>
</html>
